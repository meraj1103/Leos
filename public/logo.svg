<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Dark squircle container gradient -->
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0c0d11" />
    </linearGradient>

    <!-- Outer celestial starburst gradient (Electric Indigo to Royal Violet) -->
    <linearGradient id="outerSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Inner radiant flare gradient (Vibrant Amber / Sunburst core) -->
    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.8" />
    </radialGradient>

    <!-- Core glow filter -->
    <filter id="celestialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark squircle base -->
  <rect width="100" height="100" rx="24" fill="url(#containerGrad)" stroke="#272a34" stroke-width="1.5" />

  <!-- Secondary diagonal micro-spark (Constellation depth) -->
  <path d="M 50 24 Q 50 50 24 50 Q 50 50 50 76 Q 50 50 76 50 Q 50 50 50 24 Z" 
        fill="#8b5cf6" 
        opacity="0.45" 
        transform="rotate(45 50 50)" />

  <!-- Primary Gemini-Style Four-Pointed Starburst (Smooth Hypocycloid Curves) -->
  <path d="M 50 10 
           Q 50 48 10 50 
           Q 50 52 50 90 
           Q 50 52 90 50 
           Q 50 48 50 10 Z" 
        fill="url(#outerSparkle)" />

  <!-- Intermediate Layer Flare -->
  <path d="M 50 22 
           Q 50 48 22 50 
           Q 50 52 50 78 
           Q 50 52 78 50 
           Q 50 48 50 22 Z" 
        fill="url(#innerCore)" 
        opacity="0.9" />

  <!-- Radiant Center Light Spark -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" filter="url(#celestialGlow)" />
  <circle cx="50" cy="50" r="3.5" fill="#fef08a" />
</svg>
