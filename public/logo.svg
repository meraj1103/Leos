<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leosAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>
    <linearGradient id="leosGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e69500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#795290" stop-opacity="0.2" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean dark squircle base -->
  <rect width="100" height="100" rx="24" fill="#12141a" stroke="#252932" stroke-width="2" />

  <!-- Bold Geometric 'L' -->
  <path d="M 32 25 L 43 25 L 43 65 L 70 65 L 70 75 L 32 75 Z" 
        fill="none" 
        stroke="url(#leosAmber)" 
        stroke-width="5" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Orbiting Constellation Ellipses -->
  <ellipse cx="62" cy="42" rx="20" ry="11" 
           transform="rotate(-25 62 42)" 
           fill="none" 
           stroke="#8a7ba8" 
           stroke-width="2.5" 
           stroke-dasharray="3 3" 
           opacity="0.6" />
  
  <ellipse cx="62" cy="42" rx="14" ry="24" 
           transform="rotate(35 62 42)" 
           fill="none" 
           stroke="#e69500" 
           stroke-width="2" 
           opacity="0.8" />

  <!-- Constellation Nodes (Connected Models/Accounts) -->
  <circle cx="62" cy="42" r="4.5" fill="#ffd175" filter="url(#nodeGlow)" />
  <circle cx="73" cy="28" r="3.5" fill="#ffb347" filter="url(#nodeGlow)" />
  <circle cx="51" cy="56" r="3.5" fill="#ffd175" filter="url(#nodeGlow)" />
  <circle cx="76" cy="51" r="3" fill="#ffb347" filter="url(#nodeGlow)" />

  <!-- Connecting Node Filaments -->
  <line x1="62" y1="42" x2="73" y2="28" stroke="#ffb347" stroke-width="1.8" opacity="0.9" />
  <line x1="62" y1="42" x2="51" y2="56" stroke="#ffd175" stroke-width="1.8" opacity="0.9" />
  <line x1="62" y1="42" x2="76" y2="51" stroke="#ffb347" stroke-width="1.8" opacity="0.9" />
</svg>
